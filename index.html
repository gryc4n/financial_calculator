<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>financial-calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <aside class="side-bar">
            <div class="site-logo">
                <img class="logo" src="/assets/icons/logo.svg" alt="LOGO">
                <h1 class="site-title">FinCal</h1>
            </div>
            <div class="sections-nav">
                <ul class="nav-categories">
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" src="/assets/icons/header-icons/grey/icon5.svg" alt="dashboard icon">
                            <span class="section-title">Dashboard</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" src="/assets/icons/header-icons/grey/icon7.svg" alt="budgeting icon">
                            <span class="section-title">Budgeting</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" src="/assets/icons/header-icons/grey/icon4.svg" alt="loan graph icon">
                            <span class="section-title">Loan Graph</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" src="/assets/icons/header-icons/grey/icon2.svg" alt="savings icon">
                            <span class="section-title">Savings</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" src="/assets/icons/header-icons/grey/icon3.svg" alt="loan calculator icon">
                            <span class="section-title">Loan Calculator</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" src="/assets/icons/header-icons/grey/icon6.svg" alt="reports icon">
                            <span class="section-title">Reports</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" src="/assets/icons/header-icons/grey/icon1.svg" alt="plans and fee icon">
                            <span class="section-title">Plans & Fee</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" src="/assets/icons/header-icons/grey/icon9.svg" alt="settings icon">
                            <span class="section-title">Settings</span>
                        </button>
                    </li>
                </ul>
            </div>
        </aside>

        <div class="user-functions">

        </div>
    </header>

    <main class="main-content">

    </main>


    <script src="/_financial-calculator/js/script.js"></script>
</body>
</html>
