<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>financial-calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <aside class="side-bar">
            <a class="site-logo" href="#dashboard">
                <img class="logo" src="/assets/icons/logo.svg" alt="LOGO">
                <h1 class="site-title">FinCal</h1>
            </a>
            <div class="sections-nav">
                <ul class="nav-categories">
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" data-icon="iconDASH" src="/assets/icons/header-icons/grey/iconDASH.svg" alt="dashboard icon">
                            <span class="section-title">Dashboard</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" data-icon="iconBUD" src="/assets/icons/header-icons/grey/iconBUD.svg" alt="budgeting icon">
                            <span class="section-title">Budgeting</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" data-icon="iconLG" src="/assets/icons/header-icons/grey/iconLG.svg" alt="loan graph icon">
                            <span class="section-title">Loan Graph</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" data-icon="iconSAV" src="/assets/icons/header-icons/grey/iconSAV.svg" alt="savings icon">
                            <span class="section-title">Savings</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" data-icon="iconLC" src="/assets/icons/header-icons/grey/iconLC.svg" alt="loan calculator icon">
                            <span class="section-title">Loan Calculator</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" data-icon="iconREP" src="/assets/icons/header-icons/grey/iconREP.svg" alt="reports icon">
                            <span class="section-title">Reports</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" data-icon="iconPF" src="/assets/icons/header-icons/grey/iconPF.svg" alt="plans and fee icon">
                            <span class="section-title">Plans & Fee</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="section">
                            <img class="section-icon" data-icon="iconSETT" src="/assets/icons/header-icons/grey/iconSETT.svg" alt="settings icon">
                            <span class="section-title">Settings</span>
                        </button>
                    </li>
                </ul>
            </div>
        </aside>

    </header>

    <main class="main-content">
        <section id="dashboard" class="dashboard">

        </section>
        <section class="budgeting">
            
        </section>
        <section class="loan-graph">
            
        </section>
        <section class="savings">
            
        </section>
        <section class="loan-calculator">
            
        </section>
        <section class="reports">
            
        </section>
        <section class="plans&fee">
            
        </section>
        <section class="settings">
            
        </section>

    </main>


    <script src="js/script.js"></script>
</body>
</html>
